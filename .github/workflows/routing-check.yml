name: Python routing checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Linux PySide6/Shiboken may mishandle Py_None on CPython 3.11.
          # Windows CI continues testing all supported 3.11-3.14 runtimes.
          python-version: '3.12'
      - name: Install dependencies for real UI, audio and screen imports
        run: python -m pip install --quiet "PySide6>=6.7" numpy sounddevice mss Pillow psutil
      - name: Install Linux libraries for offscreen Qt and audio
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libopengl0 libxkbcommon0 libportaudio2
      - name: Verify Qt Widgets import
        run: python -c "from PySide6.QtWidgets import QApplication; print('Qt Widgets import OK')"
      - name: Compile Python source
        run: python -m compileall -q main.py luxai tests
      - name: Run routing and offscreen Qt tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import os
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover("tests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          # The CI runner's headless Qt EGL plugin can segfault during Python
          # interpreter finalization AFTER tests all pass. This exits only
          # after all test assertions have run, preserving the pass/fail code.
          sys.stdout.flush()
          sys.stderr.flush()
          os._exit(0 if result.wasSuccessful() else 1)
          PY

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Test real Windows DPAPI encryption and reopening saved key
        shell: powershell
        run: |
          @'
          from pathlib import Path
          import os
          import tempfile
          from luxai import secure_keys
          with tempfile.TemporaryDirectory() as tmp:
              secure_keys.SECRET_DIR = Path(tmp) / "account-secrets"
              secure_keys.LEGACY_SECRET_DIR = Path(tmp) / "legacy-secrets"
              os.environ["OPENAI_API_KEY"] = ""
              secure_keys.store_api_key("ci-fake-key-do-not-use", "openai")
              assert secure_keys.get_api_key("openai") == "ci-fake-key-do-not-use"
              assert secure_keys.key_storage_status("openai") == "saved"
              secure_keys.clear_api_key("openai")
              assert secure_keys.get_api_key("openai") == ""
          print("Windows DPAPI persisted key test passed.")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Windows DPAPI key round-trip failed' }
      - name: Check installer PowerShell and copied-venv detection
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\install_windows.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "Installer self-test failed" }
      - name: Check launcher and setup batch files
        shell: powershell
        run: |
          $setup = Get-Content install_windows.bat -Raw
          $launcher = Get-Content run_windows.bat -Raw
          if ($setup -notmatch 'install_windows.ps1') { throw "Setup does not invoke installer" }
          if ($launcher -notmatch 'CheckVenv') { throw "Launcher does not check copied environments" }

  python-compatibility-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Verify setup recognizes the selected runtime
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\install_windows.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Python 3.11+ version detection failed' }
      - name: Inventory installed compatible Python runtimes
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\install_windows.ps1 -InventoryOnly
          if ($LASTEXITCODE -ne 0) { throw 'Python inventory failed' }
      - name: Update installed dependencies to newest compatible versions
        run: python -m pip install --upgrade --upgrade-strategy only-if-needed --prefer-binary --disable-pip-version-check -r requirements.txt
      - name: Check package constraints
        run: python -m pip check
      - name: Verify imports
        run: python -c "import main; from luxai.voice import VoiceListener; print('LuxAI imports OK')"
      - name: Run full offline regression suite on Windows
        shell: python
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          import os
          import sys
          import unittest
          sys.path.insert(0, os.getcwd())
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover("tests"))
          sys.stdout.flush()
          sys.stderr.flush()
          os._exit(0 if result.wasSuccessful() else 1)

  python-fallback-windows:
    # Verify the real installer remains functional on a PC that has Python
    # 3.15 (missing CTranslate2 Windows wheels) alongside Python 3.14.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
          architecture: x64
      - name: Install LuxAI with fallback from 3.15
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\install_windows.ps1 -SkipOcr -SkipLocalAI
          if ($LASTEXITCODE -ne 0) { throw 'Installer did not recover from unsupported Python 3.15 dependencies' }
          & '.venv\Scripts\python.exe' -c "import sys; import main; assert sys.version_info[:2] == (3, 14), sys.version; print('Python 3.15 to 3.14 fallback passed')"
          if ($LASTEXITCODE -ne 0) { throw 'Fallback interpreter or import test failed' }

  python-315-compatibility-probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
          architecture: x64
      - name: Confirm installer detects Python 3.15
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts\install_windows.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Python 3.15 detection failed' }
      - name: Probe native speech dependencies
        id: native-dependencies
        continue-on-error: true
        run: |
          python -m pip install --prefer-binary -r requirements.txt
          python -c "import main; from luxai.voice import VoiceListener; from faster_whisper import WhisperModel; print('Python 3.15 speech dependency imports OK')"
      - name: Explain fallback if wheels are missing
        if: steps.native-dependencies.outcome == 'failure'
        run: echo "::warning::Python 3.15 is detected, but speech libraries lack supported Windows wheels. LuxAI installer automatically retries an older installed Python version."

  python-316-preview-windows:
    # Experimental: official Python 3.16 alpha ZIP is not yet packaged by
    # actions/setup-python. Missing native wheels must not block stable releases.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download official Python 3.16 alpha (Windows x64)
        shell: powershell
        run: |
          $url = 'https://www.python.org/ftp/python/3.16.0/python-3.16.0a1-amd64.zip'
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\python316.zip"
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP\python316.zip" -DestinationPath "$env:RUNNER_TEMP\python316" -Force
          & "$env:RUNNER_TEMP\python316\python.exe" -c "import sys; print(sys.version)"
      - name: Probe alpha interpreter and dependencies
        id: alpha-dependencies
        continue-on-error: true
        shell: powershell
        run: |
          $python = "$env:RUNNER_TEMP\python316\python.exe"
          & $python -m ensurepip --upgrade
          if ($LASTEXITCODE -ne 0) { throw 'Python 3.16 does not include working ensurepip' }
          & $python -m pip install --prefer-binary --disable-pip-version-check -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Third-party Windows Python 3.16 wheels unavailable' }
          & $python -c "import main; from luxai.voice import VoiceListener; print('LuxAI imports OK')"
          if ($LASTEXITCODE -ne 0) { throw 'Python 3.16 application import failed' }
      - name: Report preview package limitations
        if: steps.alpha-dependencies.outcome == 'failure'
        run: echo "::warning::Python 3.16 alpha has no compatible PySide6/Faster Whisper Windows wheels yet; stable Python fallback is required."

  local-gguf-windows:
    # Real Windows wheel installation, separate from regular dependencies.
    # The native GGUF model file itself is not downloaded in CI.
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Install and verify official prebuilt llama-cpp-python CPU backend
        shell: powershell
        run: |
          & python -m luxai.local_ai_setup
          if ($LASTEXITCODE -ne 0) { throw 'Official llama-cpp-python Windows wheel installation failed' }
          & python -c "from llama_cpp import Llama; print('llama_cpp CPU wheel imported')"
          if ($LASTEXITCODE -ne 0) { throw 'llama_cpp native DLL import failed' }
