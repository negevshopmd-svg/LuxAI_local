name: Python routing checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Qt for UI smoke checks
        run: python -m pip install --quiet "PySide6>=6.7"
      - name: Verify Qt Widgets import
        run: python -c "from PySide6.QtWidgets import QApplication; print('Qt Widgets import OK')"
      - name: Compile Python source
        run: python -m compileall -q main.py luxai tests
      - name: Run routing and offscreen Qt tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
