name: OCR Windows smoke test

on:
  push:
    paths:
      - ".github/workflows/ocr-windows.yml"
      - "luxai/ocr_setup.py"
      - "tests/test_bundled_ocr.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8

jobs:
  tesseract-install:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SHA-pinned bundled OCR engine and Russian/English data
        run: python -m luxai.ocr_setup
      - name: Verify installed OCR works without internet
        run: |
          python -m luxai.ocr_setup --check
          python -c "from luxai.ocr_setup import ensure_tesseract, verify_tesseract; exe, _ = ensure_tesseract(allow_download=False); ready, msg = verify_tesseract(exe); print(msg); assert ready"
      - name: Verify language OCR on an actual generated image
        run: |
          python -m pip install --disable-pip-version-check Pillow pytesseract mss
          python tests/smoke_windows_ocr.py
