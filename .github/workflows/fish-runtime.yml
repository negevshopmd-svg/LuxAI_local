name: Fish S2 Windows CPU runtime

on:
  pull_request:
    paths:
      - scripts/build_fish_runtime.py
      - tests/test_fish_runtime_build_039f.py
      - .github/workflows/fish-runtime.yml
  push:
    branches: [main]
    paths:
      - scripts/build_fish_runtime.py
      - tests/test_fish_runtime_build_039f.py
      - .github/workflows/fish-runtime.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fish-runtime-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  discard-superseded-pr-runs:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale checks on previous commits of this same PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.head_ref }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          # Only current repository, same branch, older commits, and nonterminal
          # runs. No pushes, other branches or newer commits can be cancelled.
          gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${BRANCH_NAME}&per_page=100" \
          | jq -r --arg sha "$EXPECTED_SHA" \
              '.workflow_runs[] | select(.event == "pull_request" and .head_sha != $sha and (.status == "queued" or .status == "in_progress")) | .id' \
          | while read -r run_id; do
              gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
            done


  windows-cpu-runtime:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout application build recipe
        uses: actions/checkout@v4
      - name: Set up Python for the build tool
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install pinned CMake
        run: python -m pip install --disable-pip-version-check cmake==4.4.4
      - name: Test package integrity and CPU compatibility contracts
        run: python -m unittest tests.test_fish_runtime_build_039f -v
      - name: Build pinned native CPU variants and exercise the real Windows ABI
        run: >-
          python scripts/build_fish_runtime.py
          --work-dir "${{ runner.temp }}/fish-s2-native"
          --output-dir "${{ github.workspace }}/dist/fish-runtime"
          --jobs 4
      - name: Upload verified runtime and checksum for review
        uses: actions/upload-artifact@v4
        with:
          name: fish-s2-cpu-win-x64-2c332619-v1
          path: |
            dist/fish-runtime/fish-s2-cpu-win-x64-2c332619-v1.zip
            dist/fish-runtime/fish-s2-cpu-win-x64-2c332619-v1.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified native runtime as a stable downloadable Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "fish-s2-runtime-v1"
          $folder = "dist/fish-runtime"
          gh release view $tag --repo ${{ github.repository }} 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo ${{ github.repository }} --title "Fish S2 CPU runtime (Windows x64)" --notes "Standalone s2.cpp CPU baseline and AVX2 DLLs with notices. No GGUF weights, voices or user data." --latest=false
            if ($LASTEXITCODE -ne 0) { throw "Could not create Fish runtime release" }
          }
          gh release upload $tag "$folder/fish-s2-cpu-win-x64-2c332619-v1.zip" "$folder/fish-s2-cpu-win-x64-2c332619-v1.zip.sha256" --repo ${{ github.repository }} --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not publish Fish runtime archive" }
